name: Bug report
description: 报告数据包问题 / Report a datapack issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已使用最新版数据包，且游戏为最新版或 LTS 版 / I am using the latest datapack and the latest or LTS game version
          required: true
        - label: 我确认没有打开的相同或类似 issue / I confirm there are no identical or similar open issues
          required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: e.g. v1.2.3 For MC26.3
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境（服务端） / Environment (Server)
      description: 单人游戏（自己作为房主）也选此项；不考虑 Spigot、Paper 等插件服务端。 / Singleplayer where you host the world also counts as a server; plugin servers such as Spigot or Paper are out of scope.
      options:
        - 原版 Vanilla
        - Fabric
        - NeoForge
        - 其他（在模组列表中注明）/ Other (note in mods list)
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: 模组列表 / Mods list
      description: 也包括数据包列表。 / Also include the datapack list.
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. /function #load
        2. 观察到 ... / Observed ...
        3. 日志为 ... / The log shows ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected behavior
