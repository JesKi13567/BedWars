name: Feature request
description: 建议新功能 / Suggest a feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提供思路！标题写一句话总结，细节写下面。
        Thanks for the idea! Use the title for a one-line summary and put the details below.

  - type: textarea
    id: details
    attributes:
      label: 细节 / Details
      description: 效果、触发条件、数值等，不确定也没关系。 / Effects, triggers, values; rough ideas are fine.
    validations:
      required: true
