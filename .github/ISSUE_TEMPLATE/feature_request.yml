name: Feature request
description: 建议新功能 / Suggest a feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: input
    id: summary
    attributes:
      label: 概括 / Summary
      description: 一句话说明想要的功能。 / What you want, in one sentence.
      placeholder: 例如：新增道具「秒人斧」 / e.g. New item, One-Hit Axe
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 细节 / Details
      description: 效果、触发条件、数值等，不确定也没关系。 / Effects, triggers, values; rough ideas are fine.
    validations:
      required: true
